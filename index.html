<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Take Time - Solitaire & Co-op Digital Board Companion</title>
  <meta name="description"
    content="Trợ lý số và bảng mặt đồng hồ tương tác kỹ thuật số cho board game Take Time với bộ bài Tây. 12 Chương, 40 Clock Boards, Leaflet luật chơi và lưu tiến trình.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="shared/style.css">
  <link rel="stylesheet" href="take-time.css">
</head>

<body>

  <div class="app-container" style="padding-bottom: 2rem;">

    <!-- Main Content: Clock Board & Level Guide -->
    <main style="padding: 0.75rem 1rem;">

      <!-- Chapter Horizontal Scroll Carousel -->
      <div class="chapter-pills-container" id="chapterPills">
        <!-- Rendered via JS -->
      </div>

      <!-- Level Selector Row (e.g. 1.1, 1.2, 1.3, 1.4) -->
      <div class="level-selector-row" id="levelSelectorRow">
        <!-- Rendered via JS -->
      </div>

      <!-- Interactive Clock Board (100vw on mobile) -->
      <div class="board-stage-full" id="boardStage">


        <div class="board-image-wrapper" id="boardImageWrapper">
          <img id="boardImage" class="board-image" src="" alt="Clock Board">
        </div>
      </div>

      <!-- Level Specific Rules & Field Guide -->
      <section class="level-guide-card" id="levelGuideCard" style="display:none;">
        <div class="level-guide-list" id="levelGuideList">
          <!-- Rendered dynamically via JS -->
        </div>
      </section>

    </main>

    <!-- Modals -->
    <!-- Sleeve Flip Modal -->
    <div id="sleeveModal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="modal-title" id="sleeveModalTitle">Sleeve Chương</h3>
          <button class="modal-close" onclick="closeModal('sleeveModal')">✕</button>
        </div>

        <p style="font-size:0.8rem; color:var(--text-muted); text-align:center;">
          👆 Chạm vào thẻ bài bên dưới để lật qua lại giữa Mặt Trước & Mặt Sau
        </p>

        <div class="flip-card" id="flipCard" onclick="toggleSleeveFlip()">
          <div class="flip-card-inner">
            <div class="flip-card-front">
              <img id="sleeveFrontImg" src="" alt="Sleeve Front">
            </div>
            <div class="flip-card-back">
              <img id="sleeveBackImg" src="" alt="Sleeve Back">
            </div>
          </div>
        </div>

        <button class="btn-primary" onclick="toggleSleeveFlip()" style="width:100%;">
          🔄 Lật Thẻ Sleeve
        </button>
      </div>
    </div>

    <!-- Rules Modal -->
    <div id="rulesModal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="modal-title" id="rulesModalTitle">Luật Chơi Take Time</h3>
          <button class="modal-close" onclick="closeModal('rulesModal')">✕</button>
        </div>
        <div id="rulesModalBody"></div>
      </div>
    </div>

  </div>

  <script src="shared/common.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>

</html>
